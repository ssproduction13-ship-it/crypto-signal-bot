[build]
    builder = "DOCKERFILE"
    dockerfilePath = "Dockerfile"

    [deploy]
    startCommand = "node --enable-source-maps dist/index.mjs"
    healthcheckPath = "/api/readyz"
    restartPolicyType = "ON_FAILURE"
    restartPolicyMaxRetries = 5

  [deploy.envVars]
    TZ = "Asia/Yekaterinburg"
  